<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive to different screen sizes -->
    <title>MovieLens</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171717'/%3E%3Cpath d='M18 16h28a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4Z' fill='%23f5c518'/%3E%3Ccircle cx='23' cy='23' r='2.2' fill='%23171717'/%3E%3Ccircle cx='23' cy='32' r='2.2' fill='%23171717'/%3E%3Ccircle cx='23' cy='41' r='2.2' fill='%23171717'/%3E%3Ccircle cx='41' cy='23' r='2.2' fill='%23171717'/%3E%3Ccircle cx='41' cy='32' r='2.2' fill='%23171717'/%3E%3Ccircle cx='41' cy='41' r='2.2' fill='%23171717'/%3E%3Cpath d='M28 20v24M36 20v24M18 28h28M18 36h28' stroke='%23171717' stroke-width='2.4'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="index.css"> <!-- Connection to the CSS file -->
</head>

<body>
    <!-- Blurry background for the floating menu -->
    <div class="screen-blur" id="screenBlur"></div>
    <!-- Floating menu -->
    <div class="floating-menu" id="floatingMenu">
        <button class="floating-action floating-action--primary" type="button">+ Add a movie</button>
        <button class="floating-action floating-action--secondary" type="button">☺ Get Recommendations</button>
        <button class="floating-close" id="menuClose" type="button" aria-label="Close menu">×</button>
    </div>

    <!-- ========================================== -->
    <!-- SHARED APP SHELL (Global Logo & Menu)      -->
    <!-- ========================================== -->
    <div class="global-header">
        <div class="container">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <h1 class="logo" onclick="returnToHome()">MovieLens</h1>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 1: HOME PAGE                          -->
    <!-- ========================================== -->
    <div id="homeView">
        <div class="container">
            <!-- Το Header της αρχικής κρατάει πλέον ΜΟΝΟ την αναζήτηση -->
            <header class="header" style="justify-content: flex-end;">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search movies ..." id="searchInput">
                    <button class="search-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <main class="main-content">
                <section class="movies-section">
                    <h2 class="section-title">All movies</h2>
                    <div class="movies-grid" id="moviesGrid">
                        <!-- Movie cards από JS -->
                    </div>
                </section>
            </main>

            <div class="pagination" id="pagination">
                <!-- Pagination από JS -->
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: MOVIE DETAILS (Η Νέα Οθόνη)        -->
    <!-- ========================================== -->
    <div id="detailsView" class="hidden">
        <section class="movie-detail">
            <!-- Αριστερό Panel: Πληροφορίες -->
            <div class="movie-detail__left">
                
                <!-- Το λογότυπο διαγράφηκε από εδώ για να φαίνεται το Global! -->

                <div class="movie-copy">
                    <h2 class="movie-title">
                        <span id="detailTitle">Τίτλος Ταινίας</span>
                        <span id="detailYear">(Έτος)</span>
                    </h2>

                    <div class="genre-block">
                        <p class="genre-label">GENRES</p>
                        <p class="genre-list" id="detailGenres">Είδος • Είδος</p>
                    </div>
                </div>

                <!-- Κουμπί Επιστροφής -->
                <button class="back-button" id="backButton" type="button" aria-label="Go back" onclick="hideMovieDetails()">
                    <!-- Το νέο SVG εικονίδιο -->
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
                        <polyline points="10 5 3 12 10 19"></polyline>
                        <path d="M3 12h15V4"></path>
                    </svg>
                </button>
            </div>

            <!-- Δεξί Panel: Βαθμολογία -->
            <aside class="movie-detail__right">
                <div class="rating-panel">
                    <p class="rating-panel__prompt">LET US KNOW HOW MUCH YOU LIKED IT!</p>
                    
                    <div class="rating-stars" id="detailRatingStars">
                        <button class="star empty details-star" data-rating="1">★</button>
                        <button class="star empty details-star" data-rating="2">★</button>
                        <button class="star empty details-star" data-rating="3">★</button>
                        <button class="star empty details-star" data-rating="4">★</button>
                        <button class="star empty details-star" data-rating="5">★</button>
                    </div>

                    <button class="rate-action" id="detailRateBtn">Rate</button>
                    <p class="rating-feedback" id="detailFeedback">Select a rating to continue.</p>
                </div>
            </aside>
        </section>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 3: RECOMMENDATIONS VIEW (Carousel)    -->
    <!-- ========================================== -->
<!-- VIEW 3: RECOMMENDATIONS VIEW -->
<div id="recommendationsView" class="hidden">
    <div class="container"> <!-- Προσθήκη container για ταύτιση περιθωρίων -->
        <main class="main-content"> <!-- Προσθήκη κλάσης για ταύτιση κάθετων αποστάσεων -->
            <section class="recommendations">
                <h2 class="section-title">Recommended for you</h2>
                <!-- Το separator στην αρχική σου είναι το border-bottom του section-title -->
                
                <div class="carousel-container">
                    <button class="carousel-arrow left" onclick="moveCarousel(-1)">❮</button>
                    <div class="carousel" id="recommendationCarousel">
                        <!-- Rendered by JS -->
                    </div>
                    <button class="carousel-arrow right" onclick="moveCarousel(1)">❯</button>
                </div>
            </section>
        </main>
    </div>
</div>


    <!-- Modal για Προσθήκη Ταινίας -->
    <div class="backdrop" id="backdrop" hidden></div>

    <dialog class="add-movie-modal" id="addMovieModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add a movie</h2>
            </div>

            <form class="modal-form" id="addMovieForm">
                <div class="form-group">
                    <label for="movieTitleInput" class="form-label">MOVIE TITLE</label>
                    <input id="movieTitleInput" type="text" class="form-input" placeholder="Enter new movie's title..." required />
                </div>

                <div class="form-group">
                    <label for="movieGenreSelect" class="form-label">GENRES <span style="font-size: 0.8rem; text-transform: none; color: #666;">(Hold Ctrl/Cmd to select multiple)</span></label>
                    <select id="movieGenreSelect" class="form-select" multiple required size="5">
                        <option value="Action">Action</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Animation">Animation</option>
                        <option value="Children">Children</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Crime">Crime</option>
                        <option value="Documentary">Documentary</option>
                        <option value="Drama">Drama</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Film-Noir">Film-Noir</option>
                        <option value="Horror">Horror</option>
                        <option value="Musical">Musical</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Romance">Romance</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Thriller">Thriller</option>
                        <option value="War">War</option>
                        <option value="Western">Western</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-save">Save</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="index.js"></script>

</body>
</html>
