<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieLens</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-left">
      <span class="logo">🎬 MovieLens</span>
    </div>
    <div class="header-right">
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies..." />
        <button id="searchBtn" class="search-btn">Search</button>
      </div>
      <button id="openAddModal" class="btn-add">＋ Add Movie</button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════════════════════════ -->
  <main class="main-content">

    <!-- ── Movies Section ── -->
    <section class="section" id="moviesSection">
      <h2 class="section-title">Movies</h2>
      <p class="section-sub" id="moviesSubtitle">Browsing all movies</p>
      <div id="moviesGrid" class="movies-grid">
        <p class="loading-text">Loading movies...</p>
      </div>
    </section>

    <!-- ── Recommendations Section ── -->
    <section class="section" id="recommendationsSection">
      <h2 class="section-title">Recommendations</h2>
      <p class="section-sub">Rate some movies above, then get personalized recommendations.</p>
      <div class="rec-info">
        <span id="ratedCount">0 movies rated</span>
        <button id="getRecsBtn" class="btn-primary">Get Recommendations</button>
        <button id="clearRatingsBtn" class="btn-secondary">Clear Ratings</button>
      </div>
      <div id="recsGrid" class="movies-grid"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════════
       MODAL — ADD MOVIE
  ═══════════════════════════════════════════════════════════ -->
  <div id="addMovieModal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="closeAddModal">✕</button>
      <h3 class="modal-title">Add New Movie</h3>
      <label class="form-label">Title
        <input type="text" id="newTitle" class="form-input" placeholder="e.g. Inception" />
      </label>
      <label class="form-label">Genres
        <input type="text" id="newGenres" class="form-input" placeholder="e.g. Action|Sci-Fi" />
      </label>
      <div id="addFeedback" class="feedback hidden"></div>
      <button id="submitAddMovie" class="btn-primary full-width">Add Movie</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       MODAL — MOVIE DETAILS
  ═══════════════════════════════════════════════════════════ -->
  <div id="detailsModal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="closeDetailsModal">✕</button>
      <h3 class="modal-title" id="detailsTitle">Movie Title</h3>
      <p class="modal-genres" id="detailsGenres"></p>
      <div class="avg-rating-box">
        <span class="avg-label">Average Rating</span>
        <span class="avg-value" id="detailsAvgRating">—</span>
        <span class="avg-count" id="detailsRatingCount"></span>
      </div>
      <div class="ratings-list-wrapper">
        <h4 class="ratings-list-title">All Ratings</h4>
        <div id="detailsRatingsList" class="ratings-list"></div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
